name: one-time-ref-cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete legacy branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            "agent/publish-ai-dc-verification" \
            "codex/add-stock-selection-analysis-skill" \
            "scheduler-report-update"
          do
            gh api --method DELETE \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done
