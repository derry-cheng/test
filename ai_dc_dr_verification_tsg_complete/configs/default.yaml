project:
  seed: 20260720
  interval_minutes: 15
  slots_per_day: 96
  number_of_regions: 4
  data_center_buses: [15, 42, 80, 116]
  fixed_facility_load_mw: 6.0
  # Frozen before the validation/test split as the declared study nameplate.
  # Experiment 16 only reconciles the measured envelope against this value;
  # it never uses locked-test observations to set the optimization capacity.
  flexible_capacity_mw: 118.0
  flexible_capacity_source: "predeclared study nameplate committed before data split"
  capacity_commitment_file: configs/capacity_commitment.json

data:
  burstgpt_files:
    - data/raw/burstgpt/BurstGPT_without_fails_1.csv
    - data/raw/burstgpt/BurstGPT_without_fails_2.csv
  mit_scheduler: data/raw/mit_supercloud/scheduler_data.csv
  mit_dcgm: data/raw/mit_supercloud/dcgm_verified_full.csv
  pglib_case: data/raw/pglib/pglib_opf_case118_ieee.m
  processed_dir: data/processed
  inference_peak_target_mw: 145.0
  batch_peak_target_mw: 65.0
  percentile_for_scaling: 0.99
  scaling_fit_days: 40

workload:
  classes: [realtime_inference, elastic_inference, batch_gpu]
  deadlines_slots: [0, 4, 512]
  waiting_cost_per_mwh_slot: [120.0, 8.0, 1.5]
  migration_cost_per_mwh: 3.0
  cross_region_latency_penalty_per_mwh: 0.5

market:
  event_slots: [64, 65, 66, 67, 68, 69, 70, 71]
  participating_data_center_indices: [0]
  default_dr_price_per_mwh: 150.0
  default_event_probability: 0.35
  generator_segments: 10
  # Settlement is computed with the declared 10-segment market model, while
  # realized system value is evaluated independently with a much finer model.
  evaluation_generator_segments: 80
  cross_network_evaluation_generator_segments: 40
  # Locked payment and unseen-factor transfer evaluations use a finer 40-piece
  # N--1 value model than the four-piece certificate LP.  The separate
  # held-out conversion panel reuses this independent evaluator.
  n1_evaluation_generator_segments: 40
  # Uniform mechanisms are normalized to the same event-period nodal-price
  # level inside Experiment 3. This field is retained only for the DR tariff.
  uniform_settlement_price_per_mwh: 150.0
  load_profile: [0.72, 0.70, 0.69, 0.68, 0.68, 0.69, 0.71, 0.74, 0.78, 0.82, 0.86, 0.89, 0.91, 0.92, 0.93, 0.94, 0.96, 0.98, 1.00, 0.99, 0.96, 0.91, 0.84, 0.77]

experiments:
  exp1_dr_prices: [0, 30, 60, 90, 120, 150, 210, 300]
  exp1_event_probabilities: [0.0, 0.1, 0.2, 0.35, 0.5, 0.75, 1.0]
  validation_days: 16
  # The latest 70 consecutive days having both 40 prior history days and the
  # complete 512-slot future deadline window are used: 16 for validation and
  # 54 as a temporally later locked evaluation set.
  test_days: 54
  projection_weights: [0.03, 0.1, 0.3, 1.0, 3.0, 10.0]
  # Chosen only through contiguous validation folds. Each candidate imposes a
  # separate false-credit cap on every validation day.
  risk_reserve_fractions: [0.60, 0.75, 0.90, 1.00]
  bootstrap_replications: 5000
  # Three-day blocks yield 18 independent sign-randomization units on the
  # 54-day locked test set; 6/9/18-day alternatives remain sensitivity checks.
  block_length_days: 3
  block_length_sensitivity_days: [3, 6, 9, 18]
  telemetry_undercoverage_fractions: [0.05, 0.10, 0.20]
  strategic_history_days: 40
  lookahead_slots: 512
  complexity_horizons_slots: [96, 192, 384, 608]
  stress_capacity_multipliers: [0.55, 0.7, 0.85, 1.0, 1.2]
  stress_deadline_multipliers: [0.25, 0.5, 1.0]
  network_load_multipliers: [0.9, 0.98, 1.02]
  # Full 54-day resolution-convergence panel for the near-affine RTS-24
  # boundary cell identified before mechanism claims are finalized.
  cross_network_resolution_pairs: [[10, 40], [20, 80], [40, 160], [80, 320]]
  cross_network_resolution_workers: 4
  n1_load_multiplier: 0.9
  n1_dc_peak_penetration: 0.06
  n1_security_parallel_workers: 6
  # Independent nonlinear AC contingency cases are evaluated in a bounded
  # process pool; the case set and solver formulation are unchanged. The cap
  # stays below the 20-core project limit and avoids BLAS oversubscription.
  ac_n1_workers: 8
  ac_load_multiplier: 1.0
  ac_dc_peak_penetration: 0.06
  ac_data_center_power_factor: 0.95
  # Match the primary preventive DC N-1 stress point. The AC panel therefore
  # tests the same native-load multiplier instead of a low-load surrogate.
  preventive_ac_load_multiplier: 0.90
  # Numerical equality tolerance for the fixed non-reference AC active plan;
  # every post-solve certificate rejects a larger deviation.
  preventive_ac_active_plan_tolerance_mw: 1.0e-8
  preventive_ac_dc_peak_penetrations: [0.03, 0.06, 0.09]
  # Fixed public-bus locations for the four regional AC workload injections;
  # these are declared before the cross-network panel and never selected from
  # an outage result.
  preventive_ac_dc_bus_map_one_based:
    "IEEE RTS 24-bus": [1, 2, 7, 13]
    "IEEE 30-bus": [1, 2, 13, 22]
    # This adjacent generator-bus stratum is fixed before solving; it keeps
    # the declared 9% penetration feasible under the fixed-active-plan AC
    # contingency envelope without changing any line or voltage limit.
    "IEEE 39-bus": [30, 31, 32, 33]
    "IEEE 118-bus": [1, 4, 6, 8]
  # Complete factorial spatial validation: every one of the 4! assignments is
  # evaluated at each declared penetration, with no mapping screening.
  spatial_scale_peak_penetrations: [0.03, 0.06, 0.09]
  # Use the same declared 0.90 native-load stress level as the complete N--1
  # panel so every public IEEE-118 spatial assignment has transmission headroom
  # before the 3%/6%/9% data-center penetration is added.
  spatial_scale_native_load_multiplier: 0.90
  # The indexed job-to-network certificate uses the same public RTS-24
  # benchmark as the N--1 settlement panel.  Keeping this case explicit makes
  # the coupled replay feasible and reproducible; IEEE-118 remains the
  # declared cross-network public case in Experiments 4--5 and 10/18.
  coupled_network_case: "PYPOWER case24_ieee_rts"
  coupled_network_buses_one_based: [3, 8, 15, 21]
  spatial_scale_parallel_workers: 9
  payment_certificate_parallel_workers: 6
  # The contractual certificate generator uses an exact four-segment
  # piecewise-linear value model.  The locked evaluation is independently
  # replayed at n1_evaluation_generator_segments=40.
  payment_certificate_generator_segments: 4
  payment_target_selection_parallel_workers: 6
  payment_evaluation_parallel_workers: 8
  # Experiment 22 replays the exact job witness through the same finite
  # non-islanding N--1 SCED. Four piecewise-linear segments are the declared
  # contractual network value model; bounded threads avoid matrix duplication.
  coupled_network_generator_segments: 4
  coupled_network_parallel_workers: 1
  # Full frozen-profile RTS-24 N−1 panel: 54 days × 8 event slots × 2
  # profiles. The worker cap is checked centrally against the 20-core limit.
  all_outage_panel_workers: 4
  # The transfer panel is a predeclared evenly spaced subset of the locked
  # days; the full 54-day independent evaluator remains the primary result.
  payment_unseen_transfer_days: 6
  # The continuous payment interval is certified by an exact joint LP using
  # the same four-segment value model as the contractual Experiment 9
  # certificate. Independent 40-segment replay remains reported in Exp9;
  # daily Exp15 checkpoints preserve restartability.
  interval_certificate_generator_segments: 4
  interval_certificate_parallel_workers: 4
  # The final credit trajectory is constrained on both sides of the
  # validation-selected single feasible projection.  This is a predeclared
  # physical band, not a post-hoc rule: it bounds additional under-credit by
  # at most delta MW per event sample while retaining the pointwise upper
  # false-credit certificate.
  two_sided_band_tolerance_mw: 1.0
  # All deployment-time scaling factors are fitted on validation only.  The
  # event gate is declared one hour before the event window; arrivals after
  # this checkpoint cannot enter the contractual decision.
  decision_time_event_gate_slot: 60
  # The gate-causal rolling certificate closes at the end of the declared
  # event-day horizon (slot 95).  Work with a later valid deadline remains in
  # the rolling state for the next commitment checkpoint; no post-gate arrival
  # is imported into this decision.
  decision_time_terminal_completion_index: 95
  decision_time_projection_weight: 1.0
  # Selected only on the 16 validation days under the gate information
  # boundary. The response LP remains exact; this predeclared economic grid
  # spans zero to 150 USD/MWh so the validation selector can identify a
  # non-degenerate service response without changing feasibility constraints.
  decision_time_response_dr_prices: [0.0, 10.0, 25.0, 50.0, 100.0, 150.0]
  # Projection penalties are expressed in the same daily MW trajectory units
  # as the target distance.  The larger grid is calibrated on validation so a
  # causal response can carry committed service into the event window when
  # the workload ledger supports it.
  decision_time_response_projection_weights: [0.0, 1.0, 3.0, 5.0, 7.0, 10.0, 15.0]
  # A pre-event committed service quantity makes the response LP test an
  # actual contracted flexibility obligation. It is imposed by an exact
  # linear service row on the gate ledger, not by clipping a solved profile.
  decision_time_committed_event_service_mwh: 5.0
  decision_time_require_positive_response_price: true
  # The response candidate selector permits a nonzero committed response while
  # keeping the validation false-credit budget explicit; the closed-meter
  # certificate still caps payable credit pointwise.
  decision_time_response_validation_false_budget_mwh: 20.0
  # Event-gate reserve planning is calibrated only on temporally earlier
  # validation days.  The reserve is never credited until the corresponding
  # jobs enter the committed ledger.
  event_gate_reserve_quantiles: [0.55, 0.60, 0.65, 0.70]
  event_gate_reserve_cap_quantile: 0.75
  event_gate_reserve_validation_false_credit_budget_mwh: 0.25
  # Job-level counterfactuals use scheduler declarations available at submit
  # time.  Slurm's ``--time`` is an allocation runtime, not a
  # submission-to-completion deadline.  The counterfactual therefore adds a
  # fixed, precommitted 24-hour queue allowance before that runtime; no
  # observed completion time enters the LP window.
  job_level_unbounded_timelimit_slots: 128
  job_level_submission_buffer_slots: 96
  # A precommitted one-kW/GPU nameplate keeps every finite submit-time window
  # feasible without extending a declared deadline.
  job_level_declared_per_gpu_power_cap_mw: 0.001
  # Independent controlled-event replay: a separately parameterized exact LP
  # uses this tariff and no statistical target or verifier candidate as an
  # input.  Its predeclared service floor makes the event policy structurally
  # distinct from the gate response LP; it is not selected from locked outcomes.
  # The controlled-event policy uses a distinct tariff pair from the gate
  # contract.  This prevents the meter replay from being a copy of the
  # committed response objective while retaining a predeclared positive-price
  # intervention.
  independent_event_response_price_per_mwh: 210.0
  independent_event_baseline_price_per_mwh: 120.0
  independent_event_participating_data_center_indices: [0]
  independent_event_minimum_service_mwh: 5.0
  independent_gate_baseline_price_per_mwh: 120.0
  independent_event_workers: 4
  preventive_ac_validation_day_rule: "first locked test day"
  # The preventive AC panel uses six predeclared locked snapshots rather than
  # a single outcome-selected day.  The two event endpoints test both the
  # leading and trailing edge of the eight-slot event window while keeping the
  # bounded OPF workload reproducible on a workstation.
  preventive_ac_validation_day_indices: [0, 27, 53]
  preventive_ac_validation_event_slots: [64, 71]

visualization:
  dpi: 320
  font_family: DejaVu Serif
  palette: colorblind
