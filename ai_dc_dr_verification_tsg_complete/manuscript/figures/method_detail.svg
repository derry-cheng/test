<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <defs>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <style>
      .title{font:700 25px Arial,sans-serif;fill:#0f172a}.head{font:700 19px Arial,sans-serif;fill:#0f172a}
      .body{font:400 15px Arial,sans-serif;fill:#334155}.eq{font:600 15px 'Courier New',monospace;fill:#0f766e}
      .box{stroke:#cbd5e1;stroke-width:2;rx:18} .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow2)}
      .num{font:700 15px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1400" height="500" fill="#f8fafc"/>
  <text x="700" y="38" text-anchor="middle" class="title">Sparse cumulative workload-state verifier</text>
  <text x="700" y="65" text-anchor="middle" class="body">Every edge is a real release-to-deadline service opportunity; no imputed deadline or heuristic repair is used.</text>

  <rect x="30" y="105" width="240" height="285" fill="#e0f2fe" class="box"/>
  <circle cx="65" cy="137" r="17" fill="#0284c7"/><text x="65" y="143" text-anchor="middle" class="num">1</text>
  <text x="95" y="143" class="head">Arrival ledger</text>
  <text x="55" y="190" class="body">job j: release rⱼ</text>
  <text x="55" y="216" class="body">deadline dⱼ</text>
  <text x="55" y="242" class="body">energy Eⱼ</text>
  <text x="55" y="268" class="body">region / class / site</text>
  <path d="M55 300h190" stroke="#7dd3fc" stroke-width="2"/>
  <text x="55" y="333" class="eq">xⱼₜ = 0 if t ∉ [rⱼ,dⱼ]</text>
  <text x="55" y="360" class="body">immutable positive-energy join</text>

  <rect x="320" y="105" width="280" height="285" fill="#dcfce7" class="box"/>
  <circle cx="355" cy="137" r="17" fill="#16a34a"/><text x="355" y="143" text-anchor="middle" class="num">2</text>
  <text x="385" y="143" class="head">Cumulative state</text>
  <text x="345" y="192" class="eq">y_t = y_{t-1}+x_t</text>
  <text x="345" y="230" class="eq">y_t ≤ A_t</text>
  <text x="345" y="268" class="eq">y_{d_j}−y_{r_j−1}=E_j</text>
  <text x="345" y="315" class="body">release, conservation, deadline</text>
  <text x="345" y="342" class="body">capacity and cross-midnight state</text>
  <text x="345" y="369" class="body">are linear equalities/inequalities</text>

  <rect x="650" y="105" width="300" height="285" fill="#fef3c7" class="box"/>
  <circle cx="685" cy="137" r="17" fill="#d97706"/><text x="685" y="143" text-anchor="middle" class="num">3</text>
  <text x="715" y="143" class="head">Global LP projection</text>
  <text x="675" y="193" class="eq">min ||p(x)−p~||₁ + C(x)</text>
  <text x="675" y="232" class="body">HiGHS global optimum</text>
  <text x="675" y="264" class="body">validation selects risk reserve</text>
  <text x="675" y="296" class="body">convex hull keeps feasibility</text>
  <text x="675" y="338" class="body">exact job-flow witness (Exp. 14)</text>
  <text x="675" y="366" class="body">measured trace replay (Exp. 13)</text>

  <rect x="1000" y="105" width="370" height="285" fill="#ede9fe" class="box"/>
  <circle cx="1035" cy="137" r="17" fill="#7c3aed"/><text x="1035" y="143" text-anchor="middle" class="num">4</text>
  <text x="1065" y="143" class="head">Credit and payment gate</text>
  <text x="1025" y="193" class="eq">p_safe ≤ p^{(ℓ*)}</text>
  <text x="1025" y="230" class="body">pointwise false-credit envelope</text>
  <text x="1025" y="270" class="eq">V(p;ξ) = max dual affine(ξ)</text>
  <text x="1025" y="307" class="body">q01/q10/q50/q90/q99: finite samplewise cap</text>
  <text x="1025" y="336" class="body">q99: fixed/flexible activation endpoint</text>
  <text x="1025" y="365" class="body">N–1 security and signed value</text>

  <path d="M270 248H310" class="arrow"/><path d="M600 248H640" class="arrow"/><path d="M950 248H990" class="arrow"/>
  <text x="290" y="232" text-anchor="middle" class="body">edges</text>
  <text x="620" y="232" text-anchor="middle" class="body">LP</text>
  <text x="970" y="232" text-anchor="middle" class="body">certificate</text>
</svg>
